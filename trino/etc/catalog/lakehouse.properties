connector.name=hive
hive.metastore.uri=thrift://hive-metastore:9083
hive.timestamp-precision=MICROSECONDS
hive.non-managed-table-creates-enabled=true
hive.allow-register-partition-procedure=true
fs.native-s3.enabled=true
s3.endpoint=${ENV:OLAP_ENDPOINT}
s3.region=${ENV:OLAP_REGION}
s3.path-style-access=${ENV:OLAP_S3_FORCE_PATH_STYLE}
s3.aws-access-key=${ENV:OLAP_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:OLAP_SECRET_ACCESS_KEY}