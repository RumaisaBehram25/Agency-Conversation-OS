name: Deploy to EC2

on:
  push:
    branches:
      - local/desktop-updates

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 180s
          script: |
            set -e
            cd /home/ubuntu/attora

            echo ">>> Pulling latest code..."
            git fetch origin
            git checkout local/desktop-updates
            git pull origin local/desktop-updates

            echo ">>> Writing .env file..."
            cat > .env << EOF
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            DATABASE_URL_SYNC=${{ secrets.DATABASE_URL_SYNC }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            JWT_ALGORITHM=HS256
            ACCESS_TOKEN_EXPIRE_MINUTES=30
            REFRESH_TOKEN_EXPIRE_DAYS=7
            ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
            CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
            RATE_LIMIT_PER_MINUTE=100
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            APP_NAME=Attora
            APP_ENV=production
            DEBUG=false
            LOG_LEVEL=INFO
            MANYCHAT_API_KEY=${{ secrets.MANYCHAT_API_KEY }}
            MANYCHAT_ACCOUNT_ID=${{ secrets.MANYCHAT_ACCOUNT_ID }}
            META_PIXEL_ID=${{ secrets.META_PIXEL_ID }}
            META_CAPI_CREDS=${{ secrets.META_CAPI_CREDS }}
            META_PAGE_ID=
            meta_pixel_id=${{ secrets.META_PIXEL_ID_2 }}
            Token_believethecapicred=${{ secrets.TOKEN_BELIEVE_CAPI_CREDS }}
            CRON_SECRET=${{ secrets.CRON_SECRET }}
            X-Attora-Key=${{ secrets.X_ATTORA_KEY }}
            Request_URL=${{ secrets.REQUEST_URL }}
            EOF

            echo ">>> Restarting Docker..."
            docker-compose down
            docker-compose up -d --build

            echo ">>> Deploy complete!"
            docker-compose ps
