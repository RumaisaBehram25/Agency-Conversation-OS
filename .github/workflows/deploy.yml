name: Deploy to EC2

on:
  push:
    branches:
      - local/desktop-updates

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL_SYNC }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MANYCHAT_API_KEY: ${{ secrets.MANYCHAT_API_KEY }}
          MANYCHAT_ACCOUNT_ID: ${{ secrets.MANYCHAT_ACCOUNT_ID }}
          META_PIXEL_ID: ${{ secrets.META_PIXEL_ID }}
          META_CAPI_CREDS: ${{ secrets.META_CAPI_CREDS }}
          META_PIXEL_ID_2: ${{ secrets.META_PIXEL_ID_2 }}
          TOKEN_BELIEVE_CAPI_CREDS: ${{ secrets.TOKEN_BELIEVE_CAPI_CREDS }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          X_ATTORA_KEY: ${{ secrets.X_ATTORA_KEY }}
          REQUEST_URL: ${{ secrets.REQUEST_URL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 180s
          envs: DATABASE_URL,DATABASE_URL_SYNC,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,REDIS_URL,JWT_SECRET_KEY,ENCRYPTION_KEY,CORS_ORIGINS,ANTHROPIC_API_KEY,MANYCHAT_API_KEY,MANYCHAT_ACCOUNT_ID,META_PIXEL_ID,META_CAPI_CREDS,META_PIXEL_ID_2,TOKEN_BELIEVE_CAPI_CREDS,CRON_SECRET,X_ATTORA_KEY,REQUEST_URL
          script: |
            set -e

            # Fix git safe directory
            git config --global --add safe.directory /home/ubuntu/attora

            cd /home/ubuntu/attora

            echo ">>> Pulling latest code..."
            git fetch origin
            git checkout local/desktop-updates
            git pull origin local/desktop-updates

            echo ">>> Writing .env file..."
            cat > .env << EOF
            DATABASE_URL=${DATABASE_URL}
            DATABASE_URL_SYNC=${DATABASE_URL_SYNC}
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=${POSTGRES_DB}
            REDIS_URL=${REDIS_URL}
            JWT_SECRET_KEY=${JWT_SECRET_KEY}
            JWT_ALGORITHM=HS256
            ACCESS_TOKEN_EXPIRE_MINUTES=30
            REFRESH_TOKEN_EXPIRE_DAYS=7
            ENCRYPTION_KEY=${ENCRYPTION_KEY}
            CORS_ORIGINS=${CORS_ORIGINS}
            RATE_LIMIT_PER_MINUTE=100
            ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
            APP_NAME=Attora
            APP_ENV=production
            DEBUG=false
            LOG_LEVEL=INFO
            MANYCHAT_API_KEY=${MANYCHAT_API_KEY}
            MANYCHAT_ACCOUNT_ID=${MANYCHAT_ACCOUNT_ID}
            META_PIXEL_ID=${META_PIXEL_ID}
            META_CAPI_CREDS=${META_CAPI_CREDS}
            META_PAGE_ID=
            meta_pixel_id=${META_PIXEL_ID_2}
            Token_believethecapicred=${TOKEN_BELIEVE_CAPI_CREDS}
            CRON_SECRET=${CRON_SECRET}
            X-Attora-Key=${X_ATTORA_KEY}
            Request_URL=${REQUEST_URL}
            EOF

            echo ">>> Restarting Docker..."
            docker-compose down
            docker-compose up -d --build

            echo ">>> Deploy complete!"
            docker-compose ps
