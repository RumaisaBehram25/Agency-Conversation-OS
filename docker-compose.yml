services:
  # ─── FastAPI Backend ───────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # Explicit DB URLs here ensure containers use the configured external RDS instance.
    environment:
      DATABASE_URL: postgresql+asyncpg://attora:Attora-123@attora-db.cp8ooqrtonyo.us-east-1.rds.amazonaws.com:5432/attora
      DATABASE_URL_SYNC: postgresql://attora:Attora-123@attora-db.cp8ooqrtonyo.us-east-1.rds.amazonaws.com:5432/attora
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - attora-net
    restart: unless-stopped
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --log-level info

  # ─── OLAP Scheduler ────────────────────
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles:
      - olap-selfhosted
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      trino:
        condition: service_started
    networks:
      - attora-net
    restart: unless-stopped
    command: python -m app.jobs.scheduler

  # ─── React Frontend (nginx placeholder) ────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - attora-net
    restart: unless-stopped

  # ─── PostgreSQL 16 ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-attora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Attora-123}
      POSTGRES_DB: ${POSTGRES_DB:-attora}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - attora-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-attora} -d ${POSTGRES_DB:-attora}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis 7 ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - attora-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # ─── MinIO (self hosted OLAP Object Store) ───────────────────
  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    profiles:
      - olap-selfhosted
    environment:
      MINIO_ROOT_USER: ${OLAP_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${OLAP_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    networks:
      - attora-net
    restart: unless-stopped
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-create-bucket:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    profiles:
      - olap-selfhosted
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${OLAP_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${OLAP_SECRET_ACCESS_KEY:-minioadmin}
      OLAP_BUCKET: ${OLAP_BUCKET:-attora-analytics}
    networks:
      - attora-net
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$OLAP_BUCKET
      "

  hive-metastore:
    image: apache/hive:4.0.1
    profiles:
      - olap-selfhosted
    environment:
      SERVICE_NAME: metastore
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
      HADOOP_CLASSPATH: /opt/hadoop/share/hadoop/tools/lib/*
      OLAP_ENDPOINT: ${OLAP_ENDPOINT:-http://minio:9000}
      OLAP_REGION: ${OLAP_REGION:-us-east-1}
      OLAP_ACCESS_KEY_ID: ${OLAP_ACCESS_KEY_ID:-minioadmin}
      OLAP_SECRET_ACCESS_KEY: ${OLAP_SECRET_ACCESS_KEY:-minioadmin}
      OLAP_S3_FORCE_PATH_STYLE: ${OLAP_S3_FORCE_PATH_STYLE:-true}
    networks:
      - attora-net
    volumes:
      - ./hive/conf:/hive_custom_conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9083'"]
      interval: 10s
      timeout: 5s
      retries: 10

  trino:
    image: trinodb/trino:480
    profiles:
      - olap-selfhosted
    env_file:
      - .env
    environment:
      OLAP_ENDPOINT: ${OLAP_ENDPOINT:-http://minio:9000}
      OLAP_REGION: ${OLAP_REGION:-us-east-1}
      OLAP_ACCESS_KEY_ID: ${OLAP_ACCESS_KEY_ID:-minioadmin}
      OLAP_SECRET_ACCESS_KEY: ${OLAP_SECRET_ACCESS_KEY:-minioadmin}
      OLAP_S3_FORCE_PATH_STYLE: ${OLAP_S3_FORCE_PATH_STYLE:-true}
    depends_on:
      minio:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
      hive-metastore:
        condition: service_healthy
    ports:
      - "${TRINO_HOST_PORT:-8083}:8080"
    volumes:
      - ./trino/etc:/etc/trino:ro
    networks:
      - attora-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "trino --server http://localhost:8080 --execute 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  attora-net:
    driver: bridge
